name: AI 額度 App（打包 APK）

on:
  push:
    paths:
      - "ai-quota-widget/**"
      - ".github/workflows/ai-quota-widget.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ai-quota-widget-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-quota-widget
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk ai-quota-widget.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ai-quota-widget-apk
          path: ai-quota-widget/ai-quota-widget.apk

      # 發佈到固定的 Release，手機直接開連結就能下載最新版
      - name: Publish to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ai-quota-latest
          name: AI 額度 App（最新版）
          prerelease: true
          make_latest: false
          files: ai-quota-widget/ai-quota-widget.apk
          body: |
            手機下載下方 ai-quota-widget.apk 安裝即可（需允許「安裝未知應用程式」）。
            最新建置：${{ github.ref_name }} @ ${{ github.sha }}
